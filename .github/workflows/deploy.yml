# Publishes the site to Cloudflare Pages on push to main.
#
# The whole deployable is the static build in dist/: Neighbors is one player and keeps nothing on a
# server, so there is no Worker here and nothing to bind. `wrangler pages deploy` reads the
# directory named by `pages_build_output_dir` in wrangler.toml and uploads it.
#
# Checks are duplicated from merge-group.yml because branch protection is unavailable on this plan.

name: Deploy

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - run: just check
      - run: just test
      - run: just build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://neighbors.pages.dev
    steps:
      # wrangler.toml comes from the repo; dist/ is what the build job just made.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installing wrangler here is what stops cloudflare/wrangler-action installing its own:
      # package.json names its versions through pnpm's catalog:, which npm cannot read at all, so
      # the action's `npm i wrangler@4` ends in EUNSUPPORTEDPROTOCOL. Installing first also pins
      # wrangler to the version in pnpm-lock.yaml rather than whatever @4 is today.
      # Nothing is cached in a job that holds the Cloudflare credentials: a poisoned cache would be
      # a poisoned deploy. The build job above may cache, because it publishes nothing.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: just install

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # `--branch main` is what makes this the production deployment rather than a preview: Pages
      # sorts one from the other by the branch name it is told, not by the command.
      - name: Deploy to Pages
        run: node_modules/.bin/wrangler pages deploy --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
